<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filter panel fixture</title>
  <link rel="stylesheet" href="../../vendor/pico.min.css">
  <link rel="stylesheet" href="../../shared/app-brand.css">
  <script src="../../shared/app-shell.js" defer></script>
</head>
<body data-app-id="fixture">
  <main class="container">
    <!-- Empty button: the shell draws the icons. -->
    <form class="search-layout" id="layout-a" aria-label="Filter things">
      <div class="search-side">
        <button type="button" id="toggle-a" class="filter-toggle" data-filter-toggle="things" aria-controls="panel-a"></button>
        <aside id="panel-a" class="search-sidebar" aria-label="Filter">
          <label for="search-a">Search</label>
          <input id="search-a" type="search">
        </aside>
      </div>
      <div class="search-results"><p id="results-a">Results A</p></div>
    </form>

    <!-- Own label and own icons that carry data-filter-icon. -->
    <form class="search-layout" id="layout-b" aria-label="Filter other things">
      <div class="search-side">
        <button type="button" id="toggle-b" class="filter-toggle" data-filter-toggle="others" data-filter-label="Source filters" aria-controls="panel-b">
          <svg data-filter-icon="open" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3z"/></svg>
          <svg data-filter-icon="closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M5 5h14v14H5z"/></svg>
        </button>
        <aside id="panel-b" class="search-sidebar" aria-label="Source filters">
          <label for="search-b">Other</label>
          <input id="search-b" type="search">
        </aside>
      </div>
      <div class="search-results"><p>Results B</p></div>
    </form>


    <!-- A long panel: it scrolls on its own, with the title row pinned. -->
    <form class="search-layout" id="layout-c" aria-label="Filter long things">
      <div class="search-side">
        <button type="button" id="toggle-c" class="filter-toggle" data-filter-toggle="long" aria-controls="panel-c"></button>
        <aside id="panel-c" class="search-sidebar" aria-labelledby="title-c">
          <div class="search-panel-header"><h2 class="search-panel-title" id="title-c">Filter</h2></div>
          <fieldset class="search-facet-group"><legend>Things</legend>
            <details class="mm-facet-group" open><summary>Group</summary><ul class="search-facet-list"><li><label><input type="checkbox"> Option 1 <span class="search-facet-count">(1)</span></label></li><li><label><input type="checkbox"> Option 2 <span class="search-facet-count">(2)</span></label></li><li><label><input type="checkbox"> Option 3 <span class="search-facet-count">(3)</span></label></li><li><label><input type="checkbox"> Option 4 <span class="search-facet-count">(4)</span></label></li><li><label><input type="checkbox"> Option 5 <span class="search-facet-count">(5)</span></label></li><li><label><input type="checkbox"> Option 6 <span class="search-facet-count">(6)</span></label></li><li><label><input type="checkbox"> Option 7 <span class="search-facet-count">(7)</span></label></li><li><label><input type="checkbox"> Option 8 <span class="search-facet-count">(8)</span></label></li><li><label><input type="checkbox"> Option 9 <span class="search-facet-count">(9)</span></label></li><li><label><input type="checkbox"> Option 10 <span class="search-facet-count">(10)</span></label></li><li><label><input type="checkbox"> Option 11 <span class="search-facet-count">(11)</span></label></li><li><label><input type="checkbox"> Option 12 <span class="search-facet-count">(12)</span></label></li><li><label><input type="checkbox"> Option 13 <span class="search-facet-count">(13)</span></label></li><li><label><input type="checkbox"> Option 14 <span class="search-facet-count">(14)</span></label></li><li><label><input type="checkbox"> Option 15 <span class="search-facet-count">(15)</span></label></li><li><label><input type="checkbox"> Option 16 <span class="search-facet-count">(16)</span></label></li><li><label><input type="checkbox"> Option 17 <span class="search-facet-count">(17)</span></label></li><li><label><input type="checkbox"> Option 18 <span class="search-facet-count">(18)</span></label></li><li><label><input type="checkbox"> Option 19 <span class="search-facet-count">(19)</span></label></li><li><label><input type="checkbox"> Option 20 <span class="search-facet-count">(20)</span></label></li><li><label><input type="checkbox"> Option 21 <span class="search-facet-count">(21)</span></label></li><li><label><input type="checkbox"> Option 22 <span class="search-facet-count">(22)</span></label></li><li><label><input type="checkbox"> Option 23 <span class="search-facet-count">(23)</span></label></li><li><label><input type="checkbox"> Option 24 <span class="search-facet-count">(24)</span></label></li><li><label><input type="checkbox"> Option 25 <span class="search-facet-count">(25)</span></label></li><li><label><input type="checkbox"> Option 26 <span class="search-facet-count">(26)</span></label></li><li><label><input type="checkbox"> Option 27 <span class="search-facet-count">(27)</span></label></li><li><label><input type="checkbox"> Option 28 <span class="search-facet-count">(28)</span></label></li><li><label><input type="checkbox"> Option 29 <span class="search-facet-count">(29)</span></label></li><li><label><input type="checkbox"> Option 30 <span class="search-facet-count">(30)</span></label></li><li><label><input type="checkbox"> Option 31 <span class="search-facet-count">(31)</span></label></li><li><label><input type="checkbox"> Option 32 <span class="search-facet-count">(32)</span></label></li><li><label><input type="checkbox"> Option 33 <span class="search-facet-count">(33)</span></label></li><li><label><input type="checkbox"> Option 34 <span class="search-facet-count">(34)</span></label></li><li><label><input type="checkbox"> Option 35 <span class="search-facet-count">(35)</span></label></li><li><label><input type="checkbox"> Option 36 <span class="search-facet-count">(36)</span></label></li><li><label><input type="checkbox"> Option 37 <span class="search-facet-count">(37)</span></label></li><li><label><input type="checkbox"> Option 38 <span class="search-facet-count">(38)</span></label></li><li><label><input type="checkbox"> Option 39 <span class="search-facet-count">(39)</span></label></li><li><label><input type="checkbox"> Option 40 <span class="search-facet-count">(40)</span></label></li></ul></details>
          </fieldset>
        </aside>
      </div>
      <div class="search-results"><div style="height:3000px">Tall results</div></div>
    </form>

    <!-- A toggle whose panel does not exist must not break the page. -->
    <button type="button" id="toggle-orphan" class="filter-toggle" data-filter-toggle="orphan" aria-controls="no-such-panel"></button>
  </main>
  <script>
    document.addEventListener("marin-filters-change", (event) => {
      window.__filterEvents = (window.__filterEvents || []).concat([[event.detail.button.id, event.detail.open]]);
    });
  </script>
</body>
</html>
